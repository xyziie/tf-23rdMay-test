################################################################################
# .github/workflows/terraform-prod.yml
#
# PROD ENVIRONMENT WORKFLOW
#
# Trigger logic:
#   ┌──────────────────────────────────────────────────────────────────┐
#   │  PR opened/updated → `main`        →  terraform PLAN only       │
#   │  PR merged into `main`             →  terraform APPLY           │
#   └──────────────────────────────────────────────────────────────────┘
#
# Prod apply requires a manual approval gate via GitHub Environments.
# The `prod` environment in GitHub repo settings must have a required
# reviewer configured — no one can bypass it.
#
# Authentication: Workload Identity Federation (no long-lived SA keys).
# State:          GCS bucket  tf-state-<PROD_PROJECT_ID>-prod
################################################################################

name: "Terraform — PROD"

on:
  # ── Plan: PR opened/updated targeting main ───────────────────────────────────
  pull_request:
    branches:
      - main
    paths:
      - "environments/prod/**"
      - "modules/**"

  # ── Apply: PR merged into main ───────────────────────────────────────────────
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "environments/prod/**"
      - "modules/**"

env:
  TF_VERSION:      "1.8.0"
  TF_WORKING_DIR:  "environments/prod"
  STATE_BUCKET:    "tf-state-${{ secrets.GCP_PROJECT_ID_PROD }}-prod"
  STATE_PREFIX:    "terraform/state"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — PLAN
  # Runs on: PR opened/updated targeting main
  # ════════════════════════════════════════════════════════════════════════════
  terraform-plan:
    name: "Plan — prod"
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'

    permissions:
      contents: read
      id-token:       write
      pull-requests:  write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_SA_EMAIL_PROD }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        id: init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.STATE_PREFIX }}" \
            -reconfigure \
            -input=false

      - name: Terraform Validate
        id: validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -no-color \
            -input=false \
            -out=tfplan-prod

      # ── Post plan as PR comment ──────────────────────────────────────────────
      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### 🔍 Terraform Plan — \`prod\`

            **Init:** \`${{ steps.init.outcome }}\`
            **Validate:** \`${{ steps.validate.outcome }}\`
            **Plan:** \`${{ steps.plan.outcome }}\`

            <details>
            <summary>Show Plan Output</summary>

            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            > ⚠️ **Merging this PR will trigger a prod apply.**
            > A required reviewer must approve the \`prod\` GitHub Environment before apply runs.

            *Triggered by: @${{ github.actor }} — \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — APPLY
  # Runs on: PR merged into main
  # Gated by: manual approval in GitHub `prod` Environment
  # ════════════════════════════════════════════════════════════════════════════
  terraform-apply:
    name: "Apply — prod"
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.base_ref == 'main'

    # ⚠️ This environment MUST have required reviewers configured in GitHub.
    # Go to: repo → Settings → Environments → prod → Required reviewers
    environment: prod

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_SA_EMAIL_PROD }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.STATE_PREFIX }}" \
            -reconfigure \
            -input=false

      - name: Terraform Plan (pre-apply)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file=terraform.tfvars \
            -input=false \
            -out=tfplan-prod

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan-prod

      - name: Terraform Output
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
